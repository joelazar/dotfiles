# yaml-language-server: $schema=https://gh-dash.dev/schema.json
prSections:
  - title: 🚀 My PRs
    # golang-migrate#1286 is stale upstream, hidden on purpose.
    filters: is:open author:@me -repo:golang-migrate/migrate sort:created-desc
  - title: 🆕 Review requested
    filters: is:open -is:draft review-requested:@me -author:@me -assignee:@me sort:updated-desc updated:>={{ nowModify "-4w" }} -author:renovate[bot] -author:github-actions[bot] -author:dependabot[bot] -author:onomondo-org -author:onomondo-github-actions[bot]
  - title: 👀 Involves me
    filters: is:open -assignee:@me -author:@me involves:@me -is:draft sort:created-desc -author:renovate[bot] -author:github-actions[bot] -author:dependabot[bot]
    # head: is a prefix match and repeated head: qualifiers are ORed.
  - title: 🚢 Release PRs
    filters: is:open org:onomondo head:release-please--branches-- head:renovate/self-update -head:renovate/self-update/edge sort:created-desc
    limit: 10
    repoOnly: true
  - title: 🤖 Bot PRs
    filters: is:open -is:draft sort:created-desc org:onomondo author:app/renovate author:onomondo-github-actions[bot] author:onomondo-org author:dependabot[bot] author:github-actions[bot] -head:release-please--branches-- -head:renovate/self-update
    limit: 10
    repoOnly: true
  - title: 🧑‍💻 Human PRs
    filters: is:open sort:updated-desc -author:app/renovate -author:onomondo-github-actions[bot] -author:onomondo-org -author:dependabot[bot] -author:github-actions[bot]
    repoOnly: true
issuesSections:
  - title: 📋 My Issues
    filters: is:open author:@me
  - title: 🎯 Assigned
    filters: is:open assignee:@me
notificationsSections:
  - title: 📬 All
    filters: ""
  - title: 🏢 Onomondo
    filters: "org:onomondo"
  - title: 🌍 Other
    filters: "-org:onomondo"
defaults:
  preview:
    width: 80
  notificationsLimit: 40
  prApproveComment: ""
  dateFormat: relative
  refetchIntervalMinutes: 10
  layout:
    prs:
      updatedAt:
        width: 7
      repo:
        width: 15
      lines:
        width: 16
    issues:
      updatedAt:
        width: 7
repoPaths:
  onomondo/*: ~/Code/onomondo/*
  joelazar/*: ~/Code/joelazar/*
pager:
  diff: delta
confirmQuit: true
keybindings:
  # Custom keys are listed in help in this order. Builtins left untouched:
  # g c C W t P ctrl+d are builtin, so customs avoid them (m overrides merge on purpose).
  prs:
    # ── Pi sessions (git wt worktree + new Rex tab) ──
    - key: alt+r
      name: review in pi
      command: >
        term-tab -t 'review: {{.RepoName}} PR #{{.PrNumber}}'
        (git -C {{.RepoPath}} wt {{.HeadRefName}})
        'pi --model claude-code/claude-fable-5-2 --thinking medium "/review pr {{.PrNumber}}"'
    - key: alt+f
      name: fix in pi
      command: >
        term-tab -t 'fix: {{.RepoName}} PR #{{.PrNumber}}'
        (git -C {{.RepoPath}} wt {{.HeadRefName}})
        'pi "PR {{.PrNumber}} in {{.RepoName}} has failing checks or a merge conflict. Inspect it with gh pr checks and gh pr view, fix the cause in this worktree and run the relevant tests. Show me the diff before you commit or push."'
    # ── Open / tools ─────────────────────────────
    - key: e
      name: open in nvim
      command: >
        term-tab -t 'nvim: {{.RepoName}} PR #{{.PrNumber}}' (git -C {{.RepoPath}} wt {{.HeadRefName}}) 'gh pr checkout {{.PrNumber}} && nvim'
    - key: E
      name: diff in CodeDiff
      command: >
        term-tab -t 'diff: {{.RepoName}} PR #{{.PrNumber}}' (git -C {{.RepoPath}} wt {{.HeadRefName}})
        'gh pr checkout {{.PrNumber}} && nvim -c ":CodeDiff {{.BaseRefName}}...{{.HeadRefName}}"'
    - key: O
      name: open in octo
      command: >
        term-tab -t 'octo: {{.RepoName}} PR #{{.PrNumber}}' (git -C {{.RepoPath}} wt {{.HeadRefName}})
        'gh pr checkout {{.PrNumber}} && nvim octo://{{.RepoName}}/pull/{{.PrNumber}}'
    - key: alt+o
      name: review in octo
      command: >
        term-tab -t 'octo review: {{.RepoName}} PR #{{.PrNumber}}' (git -C {{.RepoPath}} wt {{.HeadRefName}})
        'gh pr checkout {{.PrNumber}} && nvim -c "Octo review"'
    - key: T
      name: review with tuicr
      command: >
        term-tab -t 'tuicr review: {{.RepoName}} PR #{{.PrNumber}}' '{{.RepoPath}}'
        'tuicr pr {{.PrNumber}} --repo-url https://github.com/{{.RepoName}}'
    - key: ctrl+g
      name: lazygit
      command: >
        term-tab -t 'lazygit: {{.RepoName}} PR #{{.PrNumber}}' '{{.RepoPath}}' lazygit
    - key: S
      name: open shell
      command: >
        term-tab -t 'shell: {{.RepoName}} PR #{{.PrNumber}}' (git -C {{.RepoPath}} wt {{.HeadRefName}}) gh pr checkout {{.PrNumber}}
    - key: B
      name: copy branch name
      command: >
        printf '%s' '{{.HeadRefName}}' | pbcopy
    # ── Review ───────────────────────────────────
    - key: ctrl+a
      name: approve (with comment)
      command: >
        gh pr review --repo {{.RepoName}} --approve --body "$(gum input --prompt='Approval Comment: ')" {{.PrNumber}}
    - key: i
      name: comment (gum)
      command: >
        gh pr comment --repo {{.RepoName}} {{.PrNumber}}
        --body "$(gum write --placeholder 'Comment (ctrl+d to submit)' --width 80 --height 10)"
    - key: D
      name: toggle draft
      command: >
        fish -c '
        set state (gh pr view {{.PrNumber}} --repo {{.RepoName}} --json isDraft --jq ".isDraft");
        if test "$state" = "true";
        echo "Marking PR #{{.PrNumber}} ready for review...";
        gh pr ready --repo {{.RepoName}} {{.PrNumber}};
        else;
        echo "Converting PR #{{.PrNumber}} to draft...";
        gh pr ready --repo {{.RepoName}} {{.PrNumber}} --undo;
        end
        '
    # ── Merge ────────────────────────────────────
    - key: m
      name: merge (squash)
      command: >
        gh pr merge --repo {{.RepoName}} {{.PrNumber}} --squash --delete-branch
    - key: alt+m
      name: merge (admin, squash)
      command: >
        gh pr merge --repo {{.RepoName}} {{.PrNumber}} --squash --admin --delete-branch
    - key: n
      name: enable auto merge
      command: >
        gh pr merge --repo {{.RepoName}} {{.PrNumber}} --squash --auto --delete-branch
    - key: ctrl+n
      name: disable auto merge
      command: >
        gh pr merge --repo {{.RepoName}} {{.PrNumber}} --disable-auto
    # ── CI ───────────────────────────────────────
    - key: w
      builtin: watchChecks
      name: watch checks
    - key: ctrl+r
      name: retrigger workflows
      command: >
        fish -c '
        set RUN_ID (gh run list --branch {{.HeadRefName}} --repo {{.RepoName}} --limit 1 --json databaseId --jq ".[0].databaseId");
        echo "Retriggering run $RUN_ID...";
        gh run rerun --repo {{.RepoName}} $RUN_ID;
        echo "Done!"
        '
  issues:
    - key: e
      name: open in nvim
      command: >
        term-tab -t 'nvim: {{.RepoName}} issue #{{.IssueNumber}}' '{{.RepoPath}}' nvim
    - key: O
      name: open in octo
      command: >
        term-tab -t 'octo: {{.RepoName}} issue #{{.IssueNumber}}' '{{.RepoPath}}'
        'nvim octo://{{.RepoName}}/issue/{{.IssueNumber}}'
    - key: ctrl+g
      name: lazygit
      command: >
        term-tab -t 'lazygit: {{.RepoName}} issue #{{.IssueNumber}}' '{{.RepoPath}}' lazygit
    - key: ctrl+p
      name: pin issue
      command: >
        gh issue pin {{.IssueNumber}} --repo {{.RepoName}}
theme:
  colors:
    text:
      primary: "#cdd6f4"
      secondary: "#cba6f7"
      inverted: "#11111b"
      faint: "#bac2de"
      warning: "#f9e2af"
      success: "#a6e3a1"
      error: "#f38ba8"
      actor: "#a6adc8"
    background:
      selected: "#313244"
    border:
      primary: "#cba6f7"
      secondary: "#45475a"
      faint: "#313244"
    icon:
      newcontributor: "#a6e3a1"
      contributor: "#89b4fa"
      collaborator: "#94e2d5"
      member: "#f9e2af"
      owner: "#fab387"
      unknownrole: "#9399b2"
