# yaml-language-server: $schema=https://gh-dash.dev/schema.json
prSections:
  - title: 🚀 My PRs
    filters: is:open assignee:@me sort:created-desc
  - title: 🆕 Review requested
    filters: is:open -assignee:@me review-requested:@me -is:draft sort:created-desc updated:>={{ nowModify "-4w" }} -author:renovate[bot] -author:github-actions[bot] -author:dependabot[bot] -author:onomondo-org -author:onomondo-github-actions[bot]
  - title: 👀 Involves me
    filters: is:open -assignee:@me involves:@me -is:draft sort:created-desc -author:renovate[bot] -author:github-actions[bot] -author:dependabot[bot]
  - title: 🤖 Bot PRs
    filters: is:open -is:draft sort:created-desc org:onomondo author:app/renovate author:onomondo-github-actions[bot] author:onomondo-org author:dependabot[bot] author:github-actions[bot]
    limit: 10
  - title: 🔒 Recently closed my PRs
    filters: is:closed author:@me sort:created-desc
    limit: 5
  - title: 📦 Recently closed work PRs
    filters: is:closed sort:created-desc org:onomondo -author:renovate[bot] -author:github-actions[bot] -author:dependabot[bot] -author:onomondo-org -author:onomondo-github-actions[bot]
    limit: 5
  - title: 🔧 My PRs but not assigned to me
    filters: is:open author:joelazar -assignee:@me sort:created-desc
    limit: 5
issuesSections:
  - title: 📋 My Issues
    filters: is:open author:@me
  - title: 🎯 Assigned
    filters: is:open assignee:@me
notificationsSections:
  - title: 📬 All
    filters: ""
  - title: 🏢 Onomondo
    filters: "org:onomondo"
  - title: 🌍 Other
    filters: "-org:onomondo"
defaults:
  preview:
    open: true
    width: 80
    position: auto
  prsLimit: 20
  issuesLimit: 20
  notificationsLimit: 40
  view: prs
  prApproveComment: ""
  dateFormat: relative
  refetchIntervalMinutes: 10
  layout:
    prs:
      updatedAt:
        width: 7
      repo:
        width: 15
      author:
        width: 15
      assignees:
        width: 20
        hidden: true
      base:
        width: 15
        hidden: true
      lines:
        width: 16
    issues:
      updatedAt:
        width: 7
      repo:
        width: 15
      creator:
        width: 10
      assignees:
        width: 20
        hidden: true
repoPaths:
  onomondo/*: ~/Code/onomondo/*
  joelazar/*: ~/Code/joelazar/*
pager:
  diff: delta
showAuthorIcons: true
smartFilteringAtLaunch: true
confirmQuit: true
keybindings:
  # Custom keys are listed in help in this order. Builtins left untouched:
  # g c C W m t P ctrl+d are builtin, so customs avoid them.
  prs:
    # ── Open / tools ─────────────────────────────
    - key: e
      name: open in nvim
      command: >
        term-tab -t 'PR #{{.PrNumber}}' '{{.RepoPath}}' 'gh pr checkout {{.PrNumber}} && nvim'
    - key: E
      name: diff in CodeDiff
      command: >
        term-tab -t 'PR #{{.PrNumber}} diff' '{{.RepoPath}}'
        'gh pr checkout {{.PrNumber}} && nvim -c ":CodeDiff {{.BaseRefName}}...{{.HeadRefName}}"'
    - key: T
      name: review with tuicr
      command: >
        term-tab -t 'PR #{{.PrNumber}} review' '{{.RepoPath}}'
        'tuicr pr {{.PrNumber}} --repo-url https://github.com/{{.RepoName}}'
    - key: ctrl+g
      name: lazygit
      command: >
        term-tab -t lazygit '{{.RepoPath}}' lazygit
    - key: S
      name: open shell
      command: >
        term-tab -t 'PR #{{.PrNumber}}' '{{.RepoPath}}' gh pr checkout {{.PrNumber}}
    - key: B
      name: copy branch name
      command: >
        printf '%s' '{{.HeadRefName}}' | pbcopy
    # ── Review ───────────────────────────────────
    - key: ctrl+a
      name: approve (with comment)
      command: >
        gh pr review --repo {{.RepoName}} --approve --body "$(gum input --prompt='Approval Comment: ')" {{.PrNumber}}
    - key: i
      name: comment (gum)
      command: >
        gh pr comment --repo {{.RepoName}} {{.PrNumber}}
        --body "$(gum write --placeholder 'Comment (ctrl+d to submit)' --width 80 --height 10)"
    - key: D
      name: toggle draft
      command: >
        fish -c '
        set state (gh pr view {{.PrNumber}} --repo {{.RepoName}} --json isDraft --jq ".isDraft");
        if test "$state" = "true";
        echo "Marking PR #{{.PrNumber}} ready for review...";
        gh pr ready --repo {{.RepoName}} {{.PrNumber}};
        else;
        echo "Converting PR #{{.PrNumber}} to draft...";
        gh pr ready --repo {{.RepoName}} {{.PrNumber}} --undo;
        end
        '
    # ── Merge ────────────────────────────────────
    - key: M
      name: merge (squash)
      command: >
        gh pr merge --repo {{.RepoName}} {{.PrNumber}} --squash --delete-branch
    - key: alt+m
      name: merge (admin, squash)
      command: >
        gh pr merge --repo {{.RepoName}} {{.PrNumber}} --squash --admin --delete-branch
    - key: n
      name: enable auto merge
      command: >
        gh pr merge --repo {{.RepoName}} {{.PrNumber}} --squash --auto --delete-branch
    - key: ctrl+n
      name: disable auto merge
      command: >
        gh pr merge --repo {{.RepoName}} {{.PrNumber}} --disable-auto
    # ── CI ───────────────────────────────────────
    - key: w
      builtin: watchChecks
      name: watch checks
    - key: ctrl+r
      name: retrigger workflows
      command: >
        fish -c '
        set BRANCH (gh pr view {{.PrNumber}} --repo {{.RepoName}} --json headRefName --jq ".headRefName");
        echo "Branch: $BRANCH";
        set RUN_ID (gh run list --branch $BRANCH --repo {{.RepoName}} --limit 1 --json databaseId --jq ".[0].databaseId");
        echo "Retriggering run $RUN_ID...";
        gh run rerun --repo {{.RepoName}} $RUN_ID;
        echo "Done!"
        '
  issues:
    - key: e
      name: open in nvim
      command: >
        term-tab -t 'Issue #{{.IssueNumber}}' '{{.RepoPath}}' nvim
    - key: ctrl+g
      name: lazygit
      command: >
        term-tab -t lazygit '{{.RepoPath}}' lazygit
    - key: ctrl+p
      name: pin issue
      command: >
        gh issue pin {{.IssueNumber}} --repo {{.RepoName}}
theme:
  ui:
    sectionsShowCount: true
    table:
      showSeparator: true
      compact: false
  colors:
    text:
      primary: "#cdd6f4"
      secondary: "#cba6f7"
      inverted: "#11111b"
      faint: "#bac2de"
      warning: "#f9e2af"
      success: "#a6e3a1"
      error: "#f38ba8"
      actor: "#a6adc8"
    background:
      selected: "#313244"
    border:
      primary: "#cba6f7"
      secondary: "#45475a"
      faint: "#313244"
    icon:
      newcontributor: "#a6e3a1"
      contributor: "#89b4fa"
      collaborator: "#94e2d5"
      member: "#f9e2af"
      owner: "#fab387"
      unknownrole: "#9399b2"
