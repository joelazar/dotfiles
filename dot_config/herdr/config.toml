# herdr configuration
# Docs: https://herdr.dev/docs/config-reference/
# Reload after editing: herdr server reload-config  (or prefix+shift+r)

onboarding = false

[theme]
name = "catppuccin"

auto_switch = false

[terminal]
shell_mode = "auto"
new_cwd = "follow"  # new panes/tabs inherit the current working directory
[worktrees]
directory = "~/Code/worktree"

#------------------------------------------
# Key Mappings (tmux-style)
#------------------------------------------
[keys]
prefix = "ctrl+a"

# Panes: vim navigation, tmux-style splits
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
split_horizontal = "prefix+-"            # stacked split
split_vertical = "prefix+|"              # side-by-side split
close_pane = "prefix+x"
zoom = "prefix+z"
resize_mode = "prefix+r"
rename_pane = "prefix+shift+p"
last_pane = "prefix+a"                   # like `bind a last-window`
cycle_pane_next = "prefix+tab"
cycle_pane_previous = "prefix+shift+tab"

# Tabs (tmux windows)
new_tab = ["prefix+c", "ctrl+alt+c"]
next_tab = ["prefix+n", "ctrl+alt+]"]
previous_tab = ["prefix+p", "ctrl+alt+["]
rename_tab = "prefix+shift+t"
close_tab = ["prefix+shift+x", "ctrl+alt+w"]
switch_tab = ["prefix+1..9", "ctrl+1..9"]
move_tab_previous = "alt+shift+left"
move_tab_next = "alt+shift+right"

# Workspaces (tmux sessions)
new_workspace = "prefix+shift+n"
rename_workspace = "prefix+shift+w"
close_workspace = "prefix+shift+d"
workspace_picker = "prefix+w"
switch_workspace = "prefix+shift+1..9"
previous_workspace = ["prefix+alt+p", "ctrl+alt+shift+p"]
next_workspace = ["prefix+alt+n", "ctrl+alt+shift+n"]

# Misc
help = "prefix+?"
settings = "prefix+comma"
detach = ["prefix+d", "prefix+q"]
reload_config = "prefix+shift+r"
toggle_sidebar = "prefix+b"
goto = "prefix+g"
edit_scrollback = "prefix+e"

# Navigate mode: vim keys
navigate_pane_left = "h"
navigate_pane_down = "j"
navigate_pane_up = "k"
navigate_pane_right = "l"

# smart-splits.nvim: seamless ctrl+h/j/k/l between herdr panes and Neovim splits.
# Plugin is linked from the lazy.nvim clone (one-time setup):
#   herdr plugin link ~/.local/share/nvim/lazy/smart-splits.nvim
# In a pane without a neighbour the key falls through to the app
# (so ctrl+l still clears the shell, ctrl+h still backspaces).
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "smart-splits.nvim.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "smart-splits.nvim.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "smart-splits.nvim.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "smart-splits.nvim.right"
description = "navigate right (vim/herdr)"

# lazygit popup
[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
description = "run lazygit"
width = "90%"
height = "90%"

# scratch terminal popup
[[keys.command]]
key = "prefix+t"
type = "popup"
command = "exec \"${SHELL:-sh}\""
description = "scratch terminal"
width = "80%"
height = "80%"

#------------------------------------------
# UI
#------------------------------------------
[ui]
accent = "#cba6f7"
pane_borders = true
pane_gaps = true
show_agent_labels_on_pane_borders = true
hide_tab_bar_when_single_tab = true
confirm_close = true
copy_on_select = true
mouse_capture = true

agent_panel_sort = "spaces"
status_indicators = "symbols"
[ui.toast]
delivery = "system"
delay_seconds = 1

[ui.sound]
enabled = false

[experimental]
# Experimental local Kitty graphics rendering for attached clients.
# Requires a Kitty graphics-compatible outer terminal.
kitty_graphics = true
