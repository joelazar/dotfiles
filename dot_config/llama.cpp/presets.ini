version = 1

; 64K context: 32K fills up fast in an agent loop.
; KV cache at 64K q8_0 is ~6 GB, leaves headroom on 48 GB.
[*]
c = 65536

; Decision model for pi's llama.cpp classifier (Gemma 4 chat fine-tune, so pi
; scores it via logprobs, not /v1/systemone). Native context is 128K; 8K is
; plenty since pi sends the state twice per question. swa-full lets the prompt cache rewind to the shared prefix between questions.
[Winnow-E4B-Q8_0]
c = 8192
swa-full = true
