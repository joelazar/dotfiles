version = 1

; 64K context: 32K fills up fast in an agent loop.
; KV cache at 64K q8_0 is ~6 GB, leaves headroom on 48 GB.
[*]
c = 65536

; Decision model for pi's llama.cpp classifier: Base Labs elephant-1 (Qwen3.5-9B,
; AA Decision Index 66.4). mradermacher Q8_0 with waseigo's decision metadata grafted
; on (openjev readout, systemone template, attention.causal = false), so pi uses
; native /v1/systemone. Trained max length is 16K. Decision models want no RAM prompt cache.
[Elephant-1-Q8_0]
c = 16384
cache-ram = 0
image-min-tokens = 1024

; Thinking Machines Inkling 2 Mini (26B MoE, 5.4B active, looped layers).
; ggml-org IQ4_NL GGUF (1.5x faster decode than Unsloth UD-Q4_K_XL on Metal); needs llama.cpp >= b12611 (older builds give garbage).
; Vendor-recommended sampling: temp 1.0, no truncation.
; 128K context: measured ~21.5 GB peak RSS with mmproj (5 of 6 layers per block
; are 1K sliding-window, so the KV cache stays small).
[Inkling-2-Mini-IQ4_NL]
c = 131072
temp = 1.0
top-p = 1.0
top-k = 0
min-p = 0.0
