version = 1

; 64K context: 32K fills up fast in an agent loop.
; KV cache at 64K q8_0 is ~6 GB, leaves headroom on 48 GB.
[*]
c = 65536

; Decision model for pi's llama.cpp classifier. 8K is its native context;
; swa-full lets the prompt cache rewind to the shared prefix between questions.
[Winnow-E4B-Q8_0]
c = 8192
swa-full = true
