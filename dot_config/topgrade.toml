[misc]
# Cache sudo credentials up front so the run isn't blocked mid-way
pre_sudo = true
assume_yes = true
no_retry = true
cleanup = true
disable = ["chezmoi", "containers", "pnpm", "helm"]
ignore_failures = ["git_repos"]

# Run in listed order; "Custom update script" stays last (it ends with interactive prompts)
[commands]
"Fish completions" = "fish -c fish_update_completions"
"AI tools" = "ai-update"
"Television channels" = "tv update-channels"
"save-to-spotify" = "command -v save-to-spotify >/dev/null && save-to-spotify update || true"
"Custom update script" = "custom-update"

[brew]
autoremove = true

[git]
max_concurrency = 10
repos = ["~/Code/**"]
