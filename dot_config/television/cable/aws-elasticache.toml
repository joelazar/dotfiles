[metadata]
name = "aws-elasticache"
description = "A channel to select from AWS ElastiCache clusters"
requirements = ["aws"]

[source]
command = "aws elasticache describe-cache-clusters --query 'CacheClusters[].[CacheClusterId,Engine,CacheClusterStatus]' --output text"

[preview]
command = "aws elasticache describe-cache-clusters --cache-cluster-id '{split:\t:0}' --output json | jq -C"

[ui.preview_panel]
size = 60

[keybindings]
enter = "actions:open"

[actions.copy]
description = "Copy the cluster details (preview content) to the clipboard"
command = "aws elasticache describe-cache-clusters --cache-cluster-id '{split:\t:0}' --output json | pbcopy"
mode = "fork"


[actions.open]
description = "Open the resource as JSON in $EDITOR"
command = "exec >&2; d=$(mktemp -d); aws elasticache describe-cache-clusters --cache-cluster-id '{split:\t:0}' --output json > \"$d/resource.json\" && ${EDITOR:-vim} \"$d/resource.json\"; rm -rf \"$d\""
shell = "bash"
mode = "execute"
