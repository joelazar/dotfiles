[metadata]
name = "git-worktrees"
description = "List and switch between git worktrees"
requirements = ["git"]

[source]
command = "git worktree list | sed -E 's/^([^ ]+) +[0-9a-f]+ +(.*)$/\\1  \\2/'"
output = "{split: :0}"

[preview]
command = "cd '{split: :0}' && git log --oneline -10 --color=always && echo && git status --short"

[keybindings]
enter = "actions:cd"
ctrl-d = "actions:remove"

[actions.cd]
description = "Change to the selected worktree"
command = "begin; cd {split: :0} && $SHELL; end >&2; echo >&2"
mode = "execute"

[actions.remove]
description = "Remove the selected worktree"
command = "begin; git worktree remove {split: :0}; end >&2; echo >&2"
mode = "execute"
