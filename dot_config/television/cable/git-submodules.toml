[metadata]
name = "git-submodules"
description = "List and manage git submodules"
requirements = ["git"]

[source]
command = "git submodule status | awk '{print $2}'"

[preview]
command = "git -C '{}' log --oneline -10 --color=always"

[actions.update]
description = "Update the selected submodule"
command = "begin; git submodule update --init --recursive {}; end >&2; echo >&2"
mode = "execute"

[actions.sync]
description = "Sync the selected submodule URL"
command = "begin; git submodule sync {}; end >&2; echo >&2"
mode = "execute"
