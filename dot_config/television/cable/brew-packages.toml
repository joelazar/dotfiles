[metadata]
name = "brew-packages"
description = "List and manage Homebrew packages"
requirements = ["brew"]

[source]
command = [
  { name = "Formulae", run = "brew list --formula" },
  { name = "Casks",    run = "brew list --cask" },
]

[preview]
command = "brew info '{}'"

[ui]
layout = "portrait"

[keybindings]
ctrl-u = "actions:upgrade"
ctrl-d = "actions:uninstall"

[actions.upgrade]
description = "Upgrade the selected package"
command = "begin; brew upgrade {}; end >&2; echo >&2"
mode = "execute"

[actions.uninstall]
description = "Uninstall the selected package"
command = "begin; brew uninstall {}; end >&2; echo >&2"
mode = "execute"
