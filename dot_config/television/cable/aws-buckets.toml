[metadata]
name = "aws-buckets"
description = "List and preview AWS S3 Buckets"
requirements = ["aws"]

[source]
command = "aws s3 ls --output text"
output = "{split: :3|trim}"

[preview]
command = "aws s3 ls s3://{split: :3|trim} --human-readable --summarize"

[ui]
layout = "portrait"
preview_panel = { size = 60 }

[actions.list]
description = "List all objects in the selected bucket"
command = "begin; aws s3 ls s3://{split: :3|trim} --recursive --human-readable | less; end >&2; echo >&2"
mode = "execute"

[keybindings]
enter = "actions:open"

[actions.open]
description = "Open the resource as JSON in $EDITOR"
command = "exec >&2; d=$(mktemp -d); aws s3api list-objects-v2 --bucket {split: :3|trim} --output json > \"$d/resource.json\" && ${EDITOR:-vim} \"$d/resource.json\"; rm -rf \"$d\""
shell = "bash"
mode = "execute"
