[metadata]
name = "pip-packages"
description = "List installed Python packages"
requirements = ["pip"]

[source]
command = "pip list --format=freeze 2>/dev/null | cut -d= -f1"

[preview]
command = "pip show '{}'"

[ui]
layout = "portrait"

[keybindings]
ctrl-u = "actions:upgrade"
ctrl-d = "actions:uninstall"

[actions.upgrade]
description = "Upgrade the selected package"
command = "begin; pip install --upgrade {}; end >&2; echo >&2"
mode = "execute"

[actions.uninstall]
description = "Uninstall the selected package"
command = "begin; pip uninstall {}; end >&2; echo >&2"
mode = "execute"
