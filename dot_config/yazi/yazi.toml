[mgr]
ratio = [1, 2, 4]
sort_by = "natural"
sort_dir_first = true
linemode = "size"

[preview]
wrap = "yes"
max_width = 1600
max_height = 1900
image_quality = 90

[which]
sort_by = "key"

[opener]
edit = [
  { run = '${EDITOR:-vi} %s', desc = "Edit", block = true, orphan = false, for = "macos" },
]
browser = [
  { run = '${BROWSER:-/Applications/Helium.app/Contents/MacOS/Helium} %s', desc = "Browser", orphan = true, for = "macos" },
]
open = [{ run = "open %s", desc = "Open", orphan = true, for = "macos" }]
reveal = [{ run = "open -R %s1", desc = "Reveal", for = "macos" }]
extract = [
  { run = "ya pub extract --list %s", desc = "Extract here", for = "macos" },
]
play = [
  { run = 'open -a IINA %s', desc = "Play", orphan = true, for = "macos" },
]

[open]
rules = [
  # Folder
  { mime = "folder/*", use = [
    "edit",
    "open",
    "reveal",
  ] },
  # Text/code by extension (wins over mime detection quirks on empty files)
  { url = "*.{md,markdown,txt,log,json,jsonc,yaml,yml,toml,ini,conf,csv,tsv,sh,bash,fish,zsh,lua,py,rs,go,c,h,cpp,hpp,js,jsx,ts,tsx,vue,html,css,scss,sql,env,gitignore,dockerfile}", use = [
    "edit",
    "reveal",
  ] },
  # HTML
  { mime = "text/html", use = [
    "browser",
    "edit",
    "reveal",
  ] },
  # Text
  { mime = "text/*", use = [
    "edit",
    "browser",
    "reveal",
  ] },
  # Image
  { mime = "image/*", use = [
    "open",
    "reveal",
  ] },
  # Media
  { mime = "{audio,video}/*", use = [
    "play",
    "reveal",
  ] },
  # Archive
  # (yazi strips x-/vnd. prefixes from MIME types, so no application/x-* here)
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", use = [
    "extract",
    "reveal",
  ] },
  # JSON
  { mime = "application/{json,x-ndjson}", use = [
    "edit",
    "reveal",
  ] },
  { mime = "*/javascript", use = [
    "edit",
    "reveal",
  ] },
  # Empty file
  { mime = "inode/empty", use = [
    "edit",
    "reveal",
  ] },
  # Fallback
  { url = "*", use = [
    "open",
    "reveal",
    "edit",
    "browser",
  ] },
]

[[plugin.prepend_fetchers]]
id    = "git"
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
id    = "git"
url   = "*/"
run   = "git"
group = "git"

[plugin]
prepend_previewers = [
  # Archive previewer (ouch)
  { mime = "application/{*zip,tar,bzip2,7z*,rar,xz,zstd,java-archive}", run = "ouch" },
]
