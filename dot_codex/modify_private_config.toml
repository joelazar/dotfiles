#!/bin/bash
# Managed by chezmoi — tracked settings are defined below.
# Local-only sections like [projects.*] are preserved from the existing file.
# NOTE: this is a bash script, not TOML — do not run TOML formatters on it.

set -euo pipefail

# --- Tracked config (edit here) ---
MANAGED_CONFIG='model = "gpt-5.6-luna"
model_reasoning_effort = "low"
approval_policy = "on-request"
personality = "friendly"

notify = ["/Users/joelazar/.codex/computer-use/Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient", "turn-ended"]

[tui]
status_line = [
  "model-with-reasoning",
  "current-dir",
  "git-branch",
  "context-remaining",
]

[tui.model_availability_nux]
"gpt-5.5" = 3

[plugins."github@openai-curated"]
enabled = true

[plugins."browser-use@openai-bundled"]
enabled = true

[marketplaces.openai-bundled]
source_type = "local"
source = "/Users/joelazar/.codex/.tmp/bundled-marketplaces/openai-bundled"

[desktop]
appearanceTheme = "dark"
usePointerCursors = false
composerEnterBehavior = "cmdIfMultiline"
preventSleepWhileRunning = true
keepRemoteControlAwakeWhilePluggedIn = true
git-branch-prefix = ""
git-commit-instructions = "check my previous commits styling and follow that when you make commits"
git-pr-instructions = "when you open up pull request, summarize the changes in a couple of bullet points, make them concise"
default-service-tier = "priority"
dock-icon-preference = "codex-system"
conversationDetailMode = "STEPS_PROSE"
show-context-window-usage = true
appearanceDarkCodeThemeId = "catppuccin"
selected-avatar-id = "seedy"
followUpQueueMode = "queue"
realtimeVoiceScreenContextEnabled = false

[desktop.open-in-target-preferences]
global = "zed"

[desktop.appearanceDarkChromeTheme]
accent = "#cba6f7"
contrast = 60
ink = "#cdd6f4"
opaqueWindows = false
surface = "#1e1e2e"

[desktop.appearanceDarkChromeTheme.fonts]

[desktop.appearanceDarkChromeTheme.semanticColors]
diffAdded = "#a6e3a1"
diffRemoved = "#f38ba8"
skill = "#cba6f7"

[features]
js_repl = false

[apps.connector_openai_codex_document_control]
enabled = false
'

# --- Read existing file from stdin ---
EXISTING="$(cat)"

# Strategy: start from the EXISTING file and deep-merge the tracked config on
# top. This preserves the existing key order (codex rewrites the file in its own
# order, so emitting managed keys first would produce a perpetual diff) and
# keeps any app-generated section we don't know about (e.g. [hooks.state],
# [projects.*], mcp_servers, marketplaces.*.last_updated).
#
# Caveat: because existing keys are never dropped, deleting a key from
# MANAGED_CONFIG will not remove it from the target file — do that by hand.
#
# App-owned values are explicitly restored from the existing file afterwards:
#   - tui.model_availability_nux : a counter the app decrements
echo "$MANAGED_CONFIG" | tomlq -t \
  --slurpfile existing <(echo "$EXISTING" | tomlq '.') \
  '
    def dm($a; $b):
      if ($a | type) == "object" and ($b | type) == "object"
      then reduce ($b | keys_unsorted[]) as $k ($a; .[$k] = dm($a[$k]; $b[$k]))
      else $b
      end;

    . as $managed
    | dm(($existing[0] // {}); $managed)
    | if ($existing[0].tui.model_availability_nux)
        then .tui.model_availability_nux = $existing[0].tui.model_availability_nux
        else . end
  '
